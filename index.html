<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info 360 | Кременчуцький район</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px 15px;
            text-align: center;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
        }
        main {
            width: 100%;
            max-width: 650px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .feed-box {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: center;
        }
        .tg-widget-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            background-color: #229ed9;
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
        }
        footer {
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <h1>INFO 360°</h1>
        <p class="subtitle">Головний інформаційний портал | Кременчуцький район</p>
    </header>

    <main>
        <div class="feed-box">
            <p style="color: #94a3b8; margin-bottom: 15px; font-size: 0.9rem;">Останні публікації з нашого каналу:</p>
            
            <!-- Офіційний віджет Telegram -->
            <div class="tg-widget-container">
                <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-post="info360_krem/1" data-width="100%" data-dark="1"></script>
            </div>

            <a href="https://t.me/info360_krem" class="btn" target="_blank">Відкрити канал у Telegram</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Info 360 | Кременчуцький район</p>
    </footer>

</body>
</html>
