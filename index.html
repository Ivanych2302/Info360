<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info 360 | Кременчуцький район</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 25px 15px;
            text-align: center;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
        }
        main {
            width: 100%;
            max-width: 600px;
            padding: 20px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .btn {
            display: inline-block;
            background-color: #229ed9;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
        }
        .btn:active {
            background-color: #1b82b4;
        }
        footer {
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <h1>INFO 360°</h1>
        <p class="subtitle">Головний інформаційний портал | Кременчуцький район</p>
    </header>

    <main>
        <div class="card">
            <h2>Свіжі новини та події району</h2>
            <p style="color: #94a3b8; margin-bottom: 20px; font-size: 0.9rem;">Всі оперативні публікації, фото та відео доступні в нашому Telegram-каналі.</p>
            <a href="https://t.me/info360_krem" class="btn" target="_blank">Перейти до каналу Info 360</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Info 360 | Кременчуцький район</p>
    </footer>

</body>
</html>
