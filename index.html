<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFO 360° | Кременчуцький район</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: center;
        }
        .intro-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }
        .intro-box h2 {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .intro-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .feed-title {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin: 10px 0 15px 0;
            align-self: flex-start;
            font-weight: 700;
        }
        .telegram-widget-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        /* Стилизация контейнеров виджета */
        .tg-post {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
        }
        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="logo-box">360°</div>
        <h1>INFO 360°</h1>

        <!-- Описание -->
        <div class="intro-box">
            <h2>Є що показати чи оголосити? 📢</h2>
            <p>Надсилайте свої фото, відео, новини та оголошення з нашого району!</p>
        </div>

        <!-- Кнопка перехода -->
        <a href="https://t.me/info360_krem" class="link-card" target="_blank">
            <div class="link-content">
                <span style="font-size: 1.3rem;">📢</span>
                <span>Читати всі новини в Telegram</span>
            </div>
            <span>→</span>
        </a>

        <!-- Блок со свежими постами -->
        <div class="feed-title">Останні публікації:</div>

        <div class="telegram-widget-wrapper">
            <!-- Виджет поста 1 (самый свежий пост в канале, например №1) -->
            <div class="tg-post">
                <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-post="info360_krem/1" data-width="100%" data-dark="1"></script>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 INFO 360° | info360.pp.ua
    </footer>

</body>
</html>
