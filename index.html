<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFO 360° | Кременчуцький район</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3);
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: center;
        }
        .intro-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
        }
        .intro-box h2 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .intro-box p {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        /* Контейнер для вывода ленты Telegram прямо на странице */
        .feed-container {
            width: 100%;
            height: 500px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .feed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0f172a;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-bottom: 15px;
        }
        footer {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="logo-box">360°</div>
        <h1>INFO 360°</h1>

        <!-- Краткое описание -->
        <div class="intro-box">
            <h2>Стрічка новин району 📢</h2>
            <p>Усі свіжі публікації нижче або в нашому Telegram-каналі.</p>
        </div>

        <!-- ОКО ИЗ ВЕБ-ВЕРСИИ TELEGRAM ПРЯМО НА САЙТЕ -->
        <div class="feed-container">
            <iframe src="https://t.me/s/info360_krem" title="Telegram Feed"></iframe>
        </div>

        <!-- Кнопка на всякий случай -->
        <a href="https://t.me/info360_krem" class="link-card" target="_blank">
            <span>📢 Відкрити канал у додатку</span>
            <span>→</span>
        </a>
    </div>

    <footer>
        &copy; 2026 INFO 360° | info360.pp.ua
    </footer>

</body>
</html>
