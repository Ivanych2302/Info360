<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info 360 | Кременчуцький район</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-grad: linear-gradient(135deg, #8b5cf6, #ff6b00);
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            max-width: 600px;
            padding: 24px 16px;
            box-sizing: border-box;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .logo-title {
            font-size: 28px;
            font-weight: 800;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 6px 0;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }
        main {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            box-sizing: border-box;
        }
        .widget-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">INFO 360°</h1>
        <p class="subtitle">Головний інформаційний портал | Кременчуцький район</p>
    </header>

    <main>
        <div class="widget-container">
            <!-- Telegram Feed Widget -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-post="info360_krem/1" 
                    data-width="100%"></script>
        </div>
    </main>

    <footer>
        &copy; 2026 Info 360 | Кременчуцький район
    </footer>

</body>
</html>
