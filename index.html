<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFO 360° | Кременчуцький район</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0;
        }
        .logo-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .link-card:active {
            transform: scale(0.98);
            background: #334155;
        }
        .link-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon {
            font-size: 1.5rem;
        }
        .text-group {
            display: flex;
            flex-direction: column;
        }
        .title {
            font-size: 1rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .arrow {
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .main-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
        }
        .main-btn .title {
            color: #ffffff;
        }
        .main-btn .desc {
            color: #e0f2fe;
        }
        .main-btn .arrow {
            color: #ffffff;
        }
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Логотип -->
        <div class="logo-box">360°</div>

        <!-- Заголовок -->
        <h1>INFO 360°</h1>
        <p class="subtitle">Головний інформаційний портал та спільнота Кременчуцького району</p>

        <!-- Ссылки -->
        <div class="links-group">
            
            <!-- Главный канал -->
            <a href="https://t.me/info360_krem" class="link-card main-btn" target="_blank">
                <div class="link-content">
                    <span class="icon">📢</span>
                    <div class="text-group">
                        <span class="title">Telegram-канал</span>
                        <span class="desc">Оперативні новини та події району</span>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Чат / Объявления -->
            <a href="https://t.me/info360_chat" class="link-card" target="_blank">
                <div class="link-content">
                    <span class="icon">💬</span>
                    <div class="text-group">
                        <span class="title">Міський Чат & Барахолка</span>
                        <span class="desc">Оголошення, покупки та спілкування</span>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Размещение объявлений -->
            <a href="https://t.me/info360_chat" class="link-card" target="_blank">
                <div class="link-content">
                    <span class="icon">📝</span>
                    <div class="text-group">
                        <span class="title">Подати оголошення</span>
                        <span class="desc">Опублікувати товар чи послугу</span>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

        </div>
    </div>

    <footer>
        &copy; 2026 INFO 360° | info360.pp.ua
    </footer>

</body>
</html>
